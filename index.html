
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yarey Spa & Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sage: {
                50: '#F4F5F0',
                100: '#E9EBE1',
                200: '#D3D8C3',
                DEFAULT: '#7D8461', // Antique Sage
                light: '#A7AF93',
                dark: '#5D6348'
              },
              gold: {
                light: '#D4BC8C',
                DEFAULT: '#B4975A', // Phuket Brass
                dark: '#8E7543'
              },
              cream: {
                DEFAULT: '#FCF9F2', // Warm Alabaster
                dark: '#F3EFE3'
              },
              charcoal: {
                light: '#4A4A4A',
                DEFAULT: '#2D2D2D',
                dark: '#1A1A1A'
              },
            },
            fontFamily: {
              serif: ['Cormorant Garamond', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'premium': '0 20px 50px -12px rgba(125, 132, 97, 0.12)',
              'soft': '0 8px 30px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FCF9F2;
        color: #2D2D2D;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .font-serif {
        font-family: 'Cormorant Garamond', serif;
      }
      .safe-area-pt { padding-top: env(safe-area-inset-top); }
      .safe-area-pb { padding-bottom: env(safe-area-inset-bottom); }
      
      /* Smooth transitions for all interactive elements */
      button, a, input, select {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Premium Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D3D8C3;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #7D8461;
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Selection Color */
      ::selection {
        background-color: #7D8461;
        color: white;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
</head>
<body class="overflow-hidden">
    <div id="root"></div>
</body>
</html>
